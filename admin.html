<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Avant | Painel</title>
<style>
:root{--bg:#0B0F12;--sf:#12161A;--ln:rgba(201,209,216,.16);--tx:#e9edf0;--mu:#8d97a0;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(11,15,18,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:.9rem 1.25rem}
h1{margin:0;font-size:1.15rem;font-weight:700;background:linear-gradient(135deg,#f6f8fa,#9aa3ab 50%,#e8ecef);-webkit-background-clip:text;background-clip:text;color:transparent}
button,.btn{font:inherit;color:var(--tx);background:transparent;border:1px solid rgba(201,209,216,.35);border-radius:.6rem;padding:.5rem .9rem;cursor:pointer}
button:hover,.btn:hover{background:rgba(255,255,255,.07)}button.solid{background:linear-gradient(135deg,#f1f4f6,#aab3bb);color:#0B0F12;border-color:transparent;font-weight:600}
button.dg{color:#f0a0a0}.tabs{display:flex;gap:.5rem;padding:1rem 1.25rem 0}.tabs button[aria-pressed=true]{background:var(--sf);border-color:#dfe6ec}
main{max-width:980px;margin:0 auto;padding:1rem 1.25rem 4rem}input,select{width:100%;font:inherit;color:var(--tx);background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:.6rem;padding:.6rem .8rem}
label{display:block;font-size:.78rem;color:var(--mu)}label input,label select{margin-top:.3rem;font-size:.95rem;color:var(--tx)}
.row{display:flex;gap:.9rem;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:.9rem;padding:.7rem;margin-top:.7rem;flex-wrap:wrap}
.th{width:88px;height:56px;border-radius:.5rem;background:#0B0F12;border:1px solid var(--ln);overflow:hidden;flex:none}.th img{width:100%;height:100%;object-fit:cover}
.inf{flex:1;min-width:180px;display:flex;flex-direction:column}.inf span{color:var(--mu);font-size:.85rem}.ac{display:flex;gap:.35rem;flex-wrap:wrap}.ac button{padding:.35rem .6rem;font-size:.85rem}
.bd{font-style:normal;font-size:.7rem;border:1px solid #dfe6ec;border-radius:99px;padding:.05rem .5rem;margin-right:.35rem;color:#dfe6ec}.bd.off{border-color:#f0a0a0;color:#f0a0a0}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}.g .w{grid-column:1/-1}@media(min-width:640px){.g{grid-template-columns:repeat(3,1fr)}}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:1rem;padding:0;width:min(680px,calc(100% - 1.5rem))}dialog::backdrop{background:rgba(5,8,10,.75)}
.dh{padding:1rem 1.25rem;border-bottom:1px solid var(--ln);font-weight:600}.db{padding:1.25rem;max-height:70vh;overflow:auto}.df{padding:1rem 1.25rem;border-top:1px solid var(--ln);display:flex;gap:.6rem;justify-content:flex-end;align-items:center}
.chk{display:flex;gap:.5rem;align-items:center;font-size:.9rem;color:var(--tx)}.chk input{width:auto;margin:0}
.pst{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}.pt{width:104px;border:1px solid var(--ln);border-radius:.6rem;overflow:hidden;background:#0B0F12}.pt img{display:block;width:100%;height:66px;object-fit:cover}.pt div{display:flex;justify-content:space-between;padding:.15rem}.pt button{padding:.1rem .45rem;font-size:.8rem}
#msg{color:var(--mu);font-size:.85rem;padding:.6rem 1.25rem 0;max-width:980px;margin:0 auto}#msg.err,#ferr{color:#f0a0a0}.mut{color:var(--mu)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="lg" style="max-width:380px;margin:12vh auto;padding:1.5rem"><h1 style="font-size:1.6rem">Avant | Painel</h1><p class="mut">Entre para editar os carros.</p><label>E-mail<input id="le" type="email" autocomplete="username"></label><label style="margin-top:.8rem">Senha<input id="lp" type="password" autocomplete="current-password"></label><button id="lgo" class="solid" type="button" style="margin-top:1rem;width:100%">Entrar</button><p id="lerr" class="mut"></p></div>
<div id="shell" hidden>
<header>
  <h1>Avant | Painel</h1>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap">
    <a class="btn" href="index.html" target="_blank" style="text-decoration:none">Ver site</a>
    <button id="bnew">Novo carro</button>
    <button id="bout">Sair</button>
  </div>
</header>
<div class="tabs"><button data-t="cars" aria-pressed="true">Carros</button><button data-t="cfg" aria-pressed="false">Configurações</button></div>
<p id="msg"></p>
<main>
  <section id="tcars"><input id="q" type="search" placeholder="Buscar carro"><div id="list"></div></section>
  <section id="tcfg" hidden>
    <div class="g" style="margin-top:.5rem">
      <label class="w">WhatsApp (com 55 e DDD, só números)<input id="cwa" inputmode="numeric" placeholder="5547999999999"></label>
      <label class="w">Link do Instagram<input id="cinstagram" placeholder="https://instagram.com/seuperfil"></label>
      <label class="w">Link do Facebook<input id="cfacebook" placeholder="https://facebook.com/suapagina"></label>
      <label>Entrada da simulação (%)<input id="cent" type="number" min="0" max="90"></label>
      <label>Parcelas<input id="cparcelas" type="number" min="12" max="84"></label>
      <label>Taxa média (% ao mês)<input id="ctaxa" type="number" step="0.01" min="0"></label>
      <div class="w"><button id="csave" class="solid" type="button">Salvar configurações</button></div>
    </div>
  </section>
</main>

<dialog id="dlg">
  <div class="dh" id="dt">Carro</div>
  <div class="db">
    <div class="g">
      <label>Marca<input id="fm" list="brl" autocomplete="off"></label>
      <label class="w" style="grid-column:span 2">Modelo e versão<input id="fn" placeholder="Onix LT 1.0"></label>
      <label>Ano<input id="fy" type="number" min="1990" max="2030"></label>
      <label>Quilometragem<input id="fkm" inputmode="numeric" placeholder="38200"></label>
      <label>Preço (R$)<input id="fp" inputmode="numeric" placeholder="69900"></label>
      <label>Motor<input id="fmot" type="number" step="0.1" min="0.8" max="6"></label>
      <label>Câmbio<select id="fcb"><option>Manual</option><option>Automático</option></select></label>
      <label>Tipo<select id="fcar"><option>Hatch</option><option>Sedã</option><option>SUV</option><option>Picape</option></select></label>
      <label>Cor<input id="fcor"></label>
      <label>Consumo médio (km/l, opcional)<input id="fcons" inputmode="decimal"></label>
    </div>
    <div style="margin-top:1rem;display:grid;gap:.5rem">
      <label class="chk"><input id="fd" type="checkbox">Aparece na Curadoria (Home)</label>
      <label class="chk"><input id="flaudo" type="checkbox">Tem laudo cautelar aprovado</label>
      <label class="chk"><input id="fhide" type="checkbox">Ocultar do site (vendido ou pausado)</label>
    </div>
    <div style="margin-top:1.1rem"><label>Fotos (a primeira é a capa)<input id="ffotos" type="file" accept="image/*" multiple></label><div class="pst" id="pst"></div></div>
  </div>
  <div class="df"><span id="ferr"></span><button id="fcancel" type="button">Cancelar</button><button id="fsave" class="solid" type="button">Salvar carro</button></div>
</dialog>
<datalist id="brl"></datalist>
</div>

<script src="config.js"></script>
<script>
const SB = window.SB || {};
const BR = ["Audi","BMW","BYD","Caoa Chery","Chevrolet","Citroën","Fiat","Ford","GWM","Honda","Hyundai","Jeep","Kia","Land Rover","Mercedes-Benz","Mini","Mitsubishi","Nissan","Peugeot","Porsche","Ram","Renault","Suzuki","Toyota","Volkswagen","Volvo"];
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R = n => "R$ " + Number(n || 0).toLocaleString("pt-BR");
const say = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
const pub = p => SB.url + "/storage/v1/object/public/fotos/" + p;
const pick = c => ({m:c.m, n:c.n, y:c.y, km:c.km, p:c.p, mot:c.mot, cb:c.cb, car:c.car, cor:c.cor, cons:c.cons, d:c.d, laudo:c.laudo, hide:c.hide});
let tok = null, data = {config:{}, cars:[]}, cur = null;
$("brl").innerHTML = BR.map(b => '<option value="' + b + '">').join("");

// ---- Login e chamadas ao Supabase ----
const keep = t => { try { t ? localStorage.setItem("avs", JSON.stringify(t)) : localStorage.removeItem("avs"); } catch (_) {} tok = t; };
async function auth(body, grant) {
  const r = await fetch(SB.url + "/auth/v1/token?grant_type=" + grant, {method:"POST", headers:{apikey:SB.key, "Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || "E-mail ou senha incorretos.");
  keep({a:j.access_token, r:j.refresh_token, e:Date.now() + (j.expires_in - 60) * 1000});
}
async function api(path, o = {}) {
  if (!tok) throw new Error("Sessão encerrada. Entre de novo.");
  if (Date.now() > tok.e) await auth({refresh_token:tok.r}, "refresh_token");
  const h = Object.assign({apikey:SB.key, Authorization:"Bearer " + tok.a}, o.h || {});
  let body = o.body; if (o.json) { h["Content-Type"] = "application/json"; body = JSON.stringify(o.json); }
  const r = await fetch(SB.url + path, {method:o.m || "GET", headers:h, body});
  if (!r.ok) { let m = ""; try { m = (await r.json()).message; } catch (_) {} throw new Error(m || "Erro " + r.status); }
  return r.status === 204 ? null : r.json().catch(() => null);
}
async function load() {
  const [c, f] = await Promise.all([api("/rest/v1/cars?select=*&order=pos.asc,id.asc"), api("/rest/v1/config?select=*&id=eq.1")]);
  data.cars = c.map(x => Object.assign(x, {_f:(x.fotos || []).map(p => ({src:pub(p), path:p}))}));
  data.config = f[0] || {}; render(); cfgFill();
}
async function start() { $("lg").hidden = true; $("shell").hidden = false; await load(); }
$("lgo").onclick = async () => { $("lerr").textContent = ""; try { await auth({email:$("le").value.trim(), password:$("lp").value}, "password"); await start(); } catch (e) { $("lerr").textContent = e.message; } };
$("lp").addEventListener("keydown", e => { if (e.key === "Enter") $("lgo").click(); });
$("bout").onclick = () => { keep(null); location.reload(); };

// ---- Lista de carros ----
function render() {
  const q = $("q").value.toLowerCase();
  $("list").innerHTML = data.cars.map((c, i) => ({c, i})).filter(({c}) => !q || (c.m + " " + c.n + " " + c.y).toLowerCase().includes(q)).map(({c, i}) =>
    '<div class="row"><div class="th">' + (c._f[0] ? '<img src="' + esc(c._f[0].src) + '" alt="">' : '') + '</div>' +
    '<div class="inf"><b>' + esc(c.m + " " + c.n) + '</b><span>' + esc(c.y) + ' · ' + esc(c.km) + ' km · ' + R(c.p) + '</span><span>' + (c.d ? '<i class="bd">Curadoria</i>' : '') + (c.hide ? '<i class="bd off">Oculto</i>' : '') + '</span></div>' +
    '<div class="ac"><button data-a="edit" data-i="' + i + '">Editar</button><button data-a="hide" data-i="' + i + '">' + (c.hide ? 'Mostrar' : 'Ocultar') + '</button><button data-a="up" data-i="' + i + '" aria-label="Subir">↑</button><button data-a="dn" data-i="' + i + '" aria-label="Descer">↓</button><button data-a="dup" data-i="' + i + '">Duplicar</button><button class="dg" data-a="del" data-i="' + i + '">Excluir</button></div></div>').join("") || '<p class="mut">Nenhum carro ainda. Clique em Novo carro.</p>';
}
$("q").addEventListener("input", render);
$("list").addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return; const i = +b.dataset.i, a = b.dataset.a, L = data.cars, c = L[i];
  if (a === "edit") return openEdit(i);
  try {
    if (a === "del") { if (!confirm("Excluir " + c.m + " " + c.n + "?")) return; await api("/rest/v1/cars?id=eq." + c.id, {m:"DELETE"}); (c.fotos || []).forEach(p => api("/storage/v1/object/fotos/" + p, {m:"DELETE"}).catch(() => {})); }
    if (a === "hide") await api("/rest/v1/cars?id=eq." + c.id, {m:"PATCH", json:{hide:!c.hide}});
    if (a === "dup") { await api("/rest/v1/cars", {m:"POST", json:Object.assign(pick(c), {pos:Math.max(...L.map(x => x.pos)) + 1, hide:true})}); say("Cópia criada oculta e sem fotos. Edite e mostre quando estiver pronta."); }
    if (a === "up" || a === "dn") { const o = L[i + (a === "up" ? -1 : 1)]; if (!o) return; await Promise.all([api("/rest/v1/cars?id=eq." + c.id, {m:"PATCH", json:{pos:o.pos}}), api("/rest/v1/cars?id=eq." + o.id, {m:"PATCH", json:{pos:c.pos}})]); }
    await load();
  } catch (err) { say(err.message, 1); }
});

// ---- Editar / criar carro ----
const F = {m:"fm", n:"fn", y:"fy", km:"fkm", p:"fp", mot:"fmot", cb:"fcb", car:"fcar", cor:"fcor", cons:"fcons"};
function openEdit(i) {
  cur = i < 0 ? {id:0, m:"", n:"", y:new Date().getFullYear(), km:"", p:"", mot:1.0, cb:"Manual", car:"Hatch", cor:"", cons:"", _f:[]}
              : Object.assign({}, data.cars[i], {_f:data.cars[i]._f.slice()});
  cur._i = i; cur._old = cur._f.map(p => p.path).filter(Boolean);
  $("dt").textContent = i < 0 ? "Novo carro" : "Editar carro"; $("ferr").textContent = "";
  for (const k in F) $(F[k]).value = cur[k] == null ? "" : (k === "km" ? String(cur[k]).replace(/\D/g, "") : cur[k]);
  $("fd").checked = !!cur.d; $("flaudo").checked = !!cur.laudo; $("fhide").checked = !!cur.hide; $("ffotos").value = "";
  phRender(); $("dlg").showModal();
}
function phRender() {
  $("pst").innerHTML = cur._f.map((p, k) => '<div class="pt"><img src="' + esc(p.src) + '" alt=""><div><button type="button" data-k="' + k + '" data-m="-1">◀</button><button type="button" data-k="' + k + '" data-m="1">▶</button><button type="button" class="dg" data-k="' + k + '" data-m="x">✕</button></div></div>').join("");
}
$("pst").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b) return; const k = +b.dataset.k, m = b.dataset.m, f = cur._f;
  if (m === "x") f.splice(k, 1); else { const j = k + +m; if (j >= 0 && j < f.length) [f[j], f[k]] = [f[k], f[j]]; }
  phRender();
});
async function shrink(file) {
  const bmp = await createImageBitmap(file), s = Math.min(1, 1600 / bmp.width), c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s); c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
}
$("ffotos").addEventListener("change", async e => {
  $("ferr").textContent = "Preparando fotos...";
  for (const f of e.target.files) { try { const blob = await shrink(f); cur._f.push({src:URL.createObjectURL(blob), blob}); } catch (_) { $("ferr").textContent = "Uma foto não pôde ser lida."; } }
  if ($("ferr").textContent === "Preparando fotos...") $("ferr").textContent = ""; e.target.value = ""; phRender();
});
$("fcancel").onclick = () => $("dlg").close();
$("fsave").onclick = async () => {
  const v = k => $(F[k]).value.trim(), kmN = +v("km").replace(/\D/g, ""), cons = +v("cons").replace(",", ".");
  const body = {m:v("m"), n:v("n"), y:+v("y"), km:kmN.toLocaleString("pt-BR"), p:+v("p").replace(/\D/g, ""), mot:+v("mot").replace(",", "."), cb:$("fcb").value, car:$("fcar").value, cor:v("cor"), cons:cons || null, d:$("fd").checked, laudo:$("flaudo").checked, hide:$("fhide").checked};
  if (!body.m || !body.n || !body.y || !body.p || !body.mot || !kmN) { $("ferr").textContent = "Preencha marca, modelo, ano, km, preço e motor."; return; }
  $("fsave").disabled = true; $("ferr").textContent = "Salvando...";
  try {
    let id = cur.id;
    if (cur._i < 0) { body.pos = data.cars.length ? Math.max(...data.cars.map(x => x.pos)) + 1 : 0; id = (await api("/rest/v1/cars", {m:"POST", h:{Prefer:"return=representation"}, json:body}))[0].id; }
    else await api("/rest/v1/cars?id=eq." + id, {m:"PATCH", json:body});
    const paths = [];
    for (const [k, p] of cur._f.entries()) {
      if (p.path) { paths.push(p.path); continue; }
      const path = id + "/" + Date.now().toString(36) + "-" + k + ".jpg";
      await api("/storage/v1/object/fotos/" + path, {m:"POST", h:{"Content-Type":"image/jpeg"}, body:p.blob}); paths.push(path);
    }
    await api("/rest/v1/cars?id=eq." + id, {m:"PATCH", json:{fotos:paths}});
    cur._old.filter(p => !paths.includes(p)).forEach(p => api("/storage/v1/object/fotos/" + p, {m:"DELETE"}).catch(() => {}));
    $("dlg").close(); await load(); say("Carro salvo. Já está no site.");
  } catch (e) { $("ferr").textContent = e.message; }
  $("fsave").disabled = false;
};
$("bnew").onclick = () => openEdit(-1);

// ---- Configurações ----
const CF = {cwa:"wa", cinstagram:"instagram", cfacebook:"facebook", cent:"ent", cparcelas:"parcelas", ctaxa:"taxa"};
function cfgFill() { for (const id in CF) $(id).value = data.config[CF[id]] ?? ""; }
$("csave").onclick = async () => {
  const j = {}; for (const id in CF) { const v = $(id).value.trim(), k = CF[id]; j[k] = ["ent", "parcelas", "taxa"].includes(k) ? +v.replace(",", ".") : (k === "wa" ? v.replace(/\D/g, "") : v); }
  try { await api("/rest/v1/config?id=eq.1", {m:"PATCH", json:j}); say("Configurações salvas. Já valem no site."); } catch (e) { say(e.message, 1); }
};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  $("tcars").hidden = b.dataset.t !== "cars"; $("tcfg").hidden = b.dataset.t !== "cfg";
});

// ---- Início ----
if (!SB.url || !SB.key) { $("lerr").textContent = "Falta preencher o config.js com a URL e a chave do Supabase."; $("lgo").disabled = true; }
else { try { tok = JSON.parse(localStorage.getItem("avs") || "null"); } catch (_) {} if (tok) start().catch(() => { keep(null); $("lg").hidden = false; $("shell").hidden = true; }); }
</script>
</body>
</html>
